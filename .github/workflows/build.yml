name: Android XR puck APK
run-name: Build daef11a15 with verified runtime components

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: puck-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile APK and Android tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      variants: ${{ steps.variants.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: daef11a15148a7bb21e9cc0c3a68bf1e12b656bc
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/docs/releases/media/
          sparse-checkout-cone-mode: false
          persist-credentials: false
          submodules: recursive

      - name: Verify the pinned application revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "daef11a15148a7bb21e9cc0c3a68bf1e12b656bc"
          test "$(git rev-parse 'HEAD^{tree}')" = "eeff1ff9c4432fa6be500e32cf249083fb0c3487"
          git checkout -B codex/android-xr-merge-main-20261124 daef11a15148a7bb21e9cc0c3a68bf1e12b656bc

      - name: Check human authorship
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            git fetch --no-tags origin main
            base=$(git merge-base origin/main HEAD)
            checker="$RUNNER_TEMP/droiddeck-check-authorship.py"
            git show origin/main:tools/release/check_authorship.py > "$checker"
            python3 "$checker" "$base..HEAD" --event "$GITHUB_EVENT_PATH"
          elif [ "$EVENT_NAME" = push ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            python3 tools/release/check_authorship.py "$BEFORE..HEAD"
          else
            python3 tools/release/check_authorship.py HEAD
          fi

      - name: The packages a signed build ships as
        id: variants
        run: echo "list=$(awk '!/^#/ && NF { print $1 }' tools/release/variants.txt | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

      - name: No private key in the tree
        run: |
          set -euo pipefail
          keys=$(git ls-files | grep -iE '\.(jks|keystore|p12|pfx|pk8|pem|key)$' | grep -vx 'keystore/testkey.p12' || true)
          if [ -n "$keys" ]; then
            echo "::error::a private key is committed - remove it from the history and make a new one: $keys"
            exit 1
          fi

      - name: Verify backend and APK source match
        env:
          XBOX_SOURCE_TREE: eeff1ff9c4432fa6be500e32cf249083fb0c3487
        run: test "$(git rev-parse 'HEAD^{tree}')" = "$XBOX_SOURCE_TREE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-cleanup: ${{ github.event_name == 'pull_request' && 'never' || 'on-success' }}

      - name: Resolve the pinned Android NDK
        run: bash tools/ci/resolve-ndk.sh

      - name: Set the APK build label
        id: build-label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_REF: codex/android-xr-merge-main-20261124
          BUILD_SHA: daef11a15148a7bb21e9cc0c3a68bf1e12b656bc
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            tree_state=dirty
          else
            tree_state=clean
          fi
          echo "DROIDDECK_BUILD_TREE_STATE=$tree_state" >> "$GITHUB_ENV"
          if [[ -n "$PR_NUMBER" ]]; then
            label="pr${PR_NUMBER} at ${PR_HEAD_SHA:0:7}"
          else
            label="${BUILD_REF} at ${BUILD_SHA:0:7}"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "DROIDDECK_SOURCE_COMMIT=${PR_HEAD_SHA:-$BUILD_SHA}" >> "$GITHUB_ENV"
          echo "DROIDDECK_PR_NUMBER=${PR_NUMBER:-0}" >> "$GITHUB_ENV"
          echo "DROIDDECK_PR_TITLE=${PR_TITLE//$'\n'/ }" >> "$GITHUB_ENV"
          echo "Build: \`$label\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Rust toolchain for the store engines (aarch64-linux-android)
        id: rust
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          echo "rustc=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          rustc -V; cargo -V

      - name: Cache cargo registry and the store engines' target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-ndk
            app/src/main/rust/stores/target
          key: stores-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.NDK_VERSION }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('app/src/main/rust/stores/Cargo.lock') }}-${{ hashFiles('app/src/main/rust/stores/src/**', 'app/src/main/rust/stores/Cargo.toml', 'app/src/main/rust/stores/build.rs', 'app/src/main/rust/stores/.cargo/**', 'app/build.gradle') }}
          restore-keys: |
            stores-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.NDK_VERSION }}-${{ steps.rust.outputs.rustc }}-${{ hashFiles('app/src/main/rust/stores/Cargo.lock') }}-
            stores-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.NDK_VERSION }}-${{ steps.rust.outputs.rustc }}-

      - name: cargo-ndk
        run: |
          set -euo pipefail
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Cache the CMake build tree
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx
            app/build/intermediates/cxx
          key: cxx-${{ env.NDK_VERSION }}-${{ hashFiles('app/src/main/cpp/**', 'tools/vr/src/xr_*.h') }}
          restore-keys: |
            cxx-${{ env.NDK_VERSION }}-

      - uses: actions/download-artifact@v4
        with:
          run-id: 45426258345
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: prepared-components
          path: app/build
      - name: Verify and unpack prepared components
        env:
          SOURCE_TREE: eeff1ff9c4432fa6be500e32cf249083fb0c3487
        run: python3 tools/components/prepare.py unpack --tree "$SOURCE_TREE"

      # A hosted runner needs over 20 minutes per launcher; rebuild only when its sources change, and save each
      # build as soon as it finishes so a later timeout cannot discard it.
      - name: Restore the Ubisoft launcher build
        id: ubisoft-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-ubisoft
          key: ubisoft-launcher-v1-${{ steps.rust.outputs.rustc }}-${{ hashFiles('tools/ubisoft-launcher/src/**', 'tools/ubisoft-launcher/Cargo.toml', 'tools/ubisoft-launcher/Cargo.lock', 'tools/ubisoft-launcher/build.sh', 'tools/ubisoft-launcher/build.rs', 'tools/ubisoft-launcher/.cargo/**') }}
      - name: Ubisoft launcher service (x86_64-pc-windows-gnu)
        if: steps.ubisoft-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v x86_64-w64-mingw32-gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64; }
          bash tools/ubisoft-launcher/build.sh
      - name: Save the Ubisoft launcher build
        if: steps.ubisoft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-ubisoft
          key: ${{ steps.ubisoft-cache.outputs.cache-primary-key }}

      - name: Restore the Rockstar launcher build
        id: rockstar-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-rockstar
          key: rockstar-launcher-v1-${{ steps.rust.outputs.rustc }}-${{ hashFiles('tools/rockstar-launcher/src/**', 'tools/rockstar-launcher/Cargo.toml', 'tools/rockstar-launcher/Cargo.lock', 'tools/rockstar-launcher/build.sh', 'tools/rockstar-launcher/build.rs', 'tools/rockstar-launcher/.cargo/**') }}
      - name: Rockstar launcher service (32-bit and 64-bit)
        if: steps.rockstar-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v i686-w64-mingw32-gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-i686; }
          command -v x86_64-w64-mingw32-gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64; }
          bash tools/rockstar-launcher/build.sh
      - name: Save the Rockstar launcher build
        if: steps.rockstar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-rockstar
          key: ${{ steps.rockstar-cache.outputs.cache-primary-key }}

      - name: Restore the Epic launcher build
        id: epic-cache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-epic
          key: epic-launcher-v1-${{ steps.rust.outputs.rustc }}-${{ hashFiles('tools/epic-launcher/src/**', 'tools/epic-launcher/Cargo.toml', 'tools/epic-launcher/Cargo.lock', 'tools/epic-launcher/build.sh', 'tools/epic-launcher/build.rs', 'tools/epic-launcher/.cargo/**') }}
      - name: Epic Games Launcher parent stand-in (x86_64-pc-windows-gnu)
        if: steps.epic-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          command -v x86_64-w64-mingw32-gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64; }
          bash tools/epic-launcher/build.sh
      - name: Save the Epic launcher build
        if: steps.epic-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-epic
          key: ${{ steps.epic-cache.outputs.cache-primary-key }}

      - uses: actions/download-artifact@v4
        with:
          run-id: 45426258345
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: xbox-arm64
          path: app/src/main/assets/linuxfs/usr/local/lib/droiddeck-xbox

      - name: Cache checksum-pinned pack inputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/droiddeck-pack-inputs
            ~/.cache/droiddeck-build
          key: pack-inputs-v2-${{ hashFiles('tools/packs/build.sh', 'tools/packs/fetch-verified.sh', 'tools/packs/tracking/release.env', 'tools/packs/zstd/release.env', 'tools/powervr/release.json') }}
          restore-keys: pack-inputs-v2-
      - name: Build the add-on packs
        run: |
          python3 tools/powervr/fetch.py
          bash tools/packs/build.sh app/build/packs

      - name: Pin the Syncthing source
        id: syncthing-src
        run: |
          set -euo pipefail
          git submodule update --init --recursive tools/syncthing/syncthing-android
          echo "commit=$(git -C tools/syncthing/syncthing-android/syncthing/src/github.com/syncthing/syncthing rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache Syncthing
        id: syncthing
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs/arm64-v8a/libsyncthingnative.so
          key: syncthing-${{ env.NDK_VERSION }}-${{ hashFiles('tools/syncthing/build.sh', 'tools/syncthing/syncthing-android/gradle/libs.versions.toml') }}-${{ steps.syncthing-src.outputs.commit }}
      - uses: actions/setup-go@v5
        if: steps.syncthing.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - name: Build Syncthing
        if: steps.syncthing.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          export NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          tools/syncthing/build.sh app/src/main/jniLibs/arm64-v8a

      - name: Check the proot pack pin against this build
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools/packs/proot/release.env
          sha=$(sha256sum app/build/packs/proot.tar.zst | cut -d' ' -f1)
          size=$(stat -c %s app/build/packs/proot.tar.zst)
          if [ "$sha" != "$PROOT_PACK_SHA256" ] || [ "$size" != "$PROOT_PACK_SIZE" ]; then
            level=warning
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then level=error; fi
            echo "::$level::built proot pack $sha ($size bytes) does not match tools/packs/proot/release.env ($PROOT_PACK_SHA256, $PROOT_PACK_SIZE bytes). Source builds download the pinned pack, so set PROOT_PACK_SHA256=$sha and PROOT_PACK_SIZE=$size in tools/packs/proot/release.env."
            if [ "$level" = error ]; then exit 1; fi
          fi

      - name: Check out MaliBridge
        run: git submodule update --init external/MaliBridge
      - name: Fetch the Mali (Venus) component (tools/venus/release.env)
        run: |
          set -euo pipefail
          . tools/venus/release.env
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o venus.tzst \
            "https://github.com/${VENUS_REPO}/releases/download/${VENUS_TAG}/venus.tzst"
          echo "${VENUS_SHA256}  venus.tzst" | sha256sum -c -
          tar --use-compress-program=unzstd -xf venus.tzst -C app/src/main
          test -f app/src/main/jniLibs/arm64-v8a/libvirgl_test_server.so
          test -f app/src/main/assets/venus/libvulkan_virtio.so
          rm venus.tzst

      - name: Build
        id: build
        env:
          DROIDDECK_BUILD_LABEL: ${{ steps.build-label.outputs.label }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: |
          set -o pipefail
          python3 tools/powervr/fetch.py
          python3 tools/release/runtime_inputs.py record
          ./gradlew assembleRelease --console=plain -PndkVersion="$NDK_VERSION" 2>&1 | tee /tmp/build.log
          python3 tools/release/check_session_assets.py app/build/outputs/apk/release/app-release.apk
          python3 tools/release/runtime_inputs.py apk app/build/outputs/apk/release/app-release.apk

      - name: Check the store engines' library
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          python3 tools/release/check_android_libraries.py app/build/outputs/apk/release/app-release.apk \
            --readelf "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          git diff --stat -- app/src/main/rust/stores/Cargo.lock
          git diff --exit-code -- app/src/main/rust/stores/Cargo.lock \
            || { echo "::error::Cargo.lock changed during the build; commit the regenerated lockfile (uploaded as stores-cargo-lock)"; exit 1; }

      - name: Upload the regenerated Cargo.lock
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stores-cargo-lock
          path: app/src/main/rust/stores/Cargo.lock
          if-no-files-found: ignore
          overwrite: true

      - name: Resolve the Robolectric version
        id: robolectric
        run: |
          echo "version=$(grep -o "org.robolectric:robolectric:[0-9.]*" app/build.gradle | cut -d: -f3)" >> "$GITHUB_OUTPUT"
      # Robolectric downloads these from Maven Central on first use without retrying, and 429s fail whole test classes.
      # The cache path sits beside the workspace because runner homes are at different depths from it, and
      # actions/cache stores paths relative to the workspace. Runners that keep their own ~/.m2 skip the cache.
      - name: Place Robolectric's Android jars beside the workspace
        id: robolectric-jars
        run: |
          set -euo pipefail
          jars="$GITHUB_WORKSPACE/../robolectric-jars"
          m2="$HOME/.m2/repository/org/robolectric/android-all-instrumented"
          if [ -d "$m2" ] && [ ! -L "$m2" ]; then
            echo "cache=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$jars" "$(dirname "$m2")"
            ln -sfn "$(cd "$jars" && pwd)" "$m2"
            echo "cache=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Robolectric's Android jars
        if: steps.robolectric-jars.outputs.cache == 'true'
        uses: actions/cache@v4
        with:
          path: ../robolectric-jars
          key: robolectric-android-all-v2-${{ steps.robolectric.outputs.version }}
      - name: Unit tests
        id: unit-tests
        env:
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://repo.maven.apache.org/maven2
          DROIDDECK_BUILD_LABEL: ${{ steps.build-label.outputs.label }}
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p app/build
          ./gradlew testReleaseUnitTest --console=plain --info --stacktrace -Drobolectric.logging=stderr -PndkVersion="$NDK_VERSION" 2>&1 | tee app/build/unit-tests.log

      - name: Upload unit test diagnostics
        id: unit-test-diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/unit-tests.log
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Sign with the testkey (v1 + v2 + v3)
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/zipalign" -p -f 4 "$APK" "$APK.aligned"
          "$TOOLS/apksigner" sign \
            --ks keystore/testkey.p12 --ks-type PKCS12 --ks-pass pass:android \
            --ks-key-alias testkey --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$APK.aligned"
          rm -f "$APK.aligned" "$APK.idsig"

      - name: Check the signature
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --min-sdk-version 21 --verbose --print-certs "$APK" | tee /tmp/sig.txt
          unzip -l "$APK" | grep -qE 'META-INF/.*\.(SF|RSA|DSA)$' \
            || { echo "::error::apk carries no JAR signature files"; exit 1; }
          for scheme in "v1 scheme (JAR signing): true" "v2 scheme (APK Signature Scheme v2): true" \
                        "v3 scheme (APK Signature Scheme v3): true"; do
            grep -qF "$scheme" /tmp/sig.txt || { echo "::error::apk is not signed with $scheme"; exit 1; }
          done
          grep -qi "CN=Android, OU=Android, O=Android" /tmp/sig.txt \
            || { echo "::error::apk is not signed with the AOSP testkey"; exit 1; }

      - uses: actions/upload-artifact@v4
        id: apk-upload
        with:
          name: droiddeck-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true

      - uses: actions/upload-artifact@v4
        with:
          name: droiddeck-packs
          path: app/build/packs/*.tar.zst
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: true
